<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comfyday</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body>
    <main class="page">
      <div class="content">
        <div class="model-row">
          <div class="scene-stage">
            <img
              id="base-photo"
              class="base-photo is-hidden"
              alt="Base model photo"
              src=""
            />
            <div class="missing-base is-hidden" id="missing-base">
              Outfit image missing under <code>static/generated/flux2/</code>.
            </div>
            <div class="scene-layers" id="scene-layers"></div>
          </div>

          <a
            class="github-link"
            href="https://github.com/rxdt/comfyday-public"
            aria-label="View Comfyday on GitHub"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"
              />
            </svg>
          </a>
        </div>

        <section class="weather-block">
          <p class="weather-title">
            <span id="weather-title-prefix">Current weather in</span>
            <span id="location-label">San Francisco</span>
          </p>
          <p class="weather-info">
            <span id="temperature">--</span>&deg;
            <span class="separator">·</span>
            <span id="rain-chance">--</span>% rain
            <span class="separator">·</span>
            <span id="description">loading weather</span>
            <span id="wind-fragment"></span>
          </p>
          <p class="weather-outfit-note" id="outfit-note"></p>
          <p class="status-line" id="status-line">Getting current weather...</p>
          <p class="weather-last-updated">
            Last updated: <span id="last-updated">--</span>
          </p>
        </section>

        <form id="time-form" class="weather-controls">
          <div class="weather-form-row">
            <label class="time-prompt" for="hours-ahead">Check the weather in</label>
            <input
              id="hours-ahead"
              name="hours_ahead"
              type="number"
              min="0"
              max="{{ max_forecast_hours }}"
              step="1"
              value="0"
              inputmode="numeric"
            />
            <span class="time-prompt">hours</span>
            <button type="submit">Go</button>
          </div>
          <div class="weather-form-row">
            <label class="time-prompt" for="location-query">ZIP code</label>
            <input
              id="location-query"
              name="query"
              type="text"
              maxlength="5"
              value="94110"
              placeholder="94110"
              autocomplete="postal-code"
              inputmode="numeric"
              pattern="\d{5}"
            />
            <button type="submit">Go</button>
          </div>
        </form>
      </div>
    </main>

    <script>
      window.__INITIAL_SCENE__ = {{ initial_scene|safe }};
      window.__MAX_FORECAST_HOURS__ = {{ max_forecast_hours }};
    </script>
    <script type="module" src="{{ url_for('static', path='app.js') }}"></script>
  </body>
</html>
